[tools]
bun = "latest"
hk = "latest"
node = "lts"
pkl = "latest"
rust = { version = "latest", targets = "aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc" }
"cargo:cargo-xwin" = "latest"

[env]
HK_MISE = 1
# Runs the project's own Biome, whatever else is on PATH.
_.path = ["{{config_root}}/node_modules/.bin"]

[hooks]
postinstall = "hk install --mise && bun install"

[tasks.dev]
description = "Run the app in development mode"
run = "bun tauri dev"

[tasks.build]
description = "Build the app for the host platform"
run = "bun tauri build"

# Linux needs a Linux host. Windows cross-builds the NSIS installer elsewhere
# (needs Homebrew llvm, lld and nsis on macOS).
[tasks."build:macos"]
description = "Build a universal macOS app (run on macOS)"
run = "bun tauri build --target universal-apple-darwin"

[tasks."build:windows"]
description = "Build the Windows installer"
run = 'PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH" bun tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis'
run_windows = "bun tauri build --target x86_64-pc-windows-msvc"

[tasks."build:linux"]
description = "Build the Linux bundles (run on Linux)"
run = "bun tauri build --target x86_64-unknown-linux-gnu"

[tasks.checks]
description = "Run all checks"
depends = ["biome", "check", "test", "format:check", "lint"]

[tasks.biome]
description = "Lint and check formatting of the frontend with Biome"
run = "biome ci ."

[tasks.check]
description = "Typecheck the Svelte frontend"
run = "bun run check"

[tasks.test]
description = "Run the frontend unit tests"
run = "bun test"

[tasks.format]
description = "Format Rust code"
dir = "src-tauri"
run = "cargo fmt"

[tasks."format:check"]
description = "Check Rust code formatting"
dir = "src-tauri"
run = "cargo fmt --check"

[tasks.lint]
description = "Lint Rust code with Clippy"
dir = "src-tauri"
run = "cargo clippy -- --deny warnings"
