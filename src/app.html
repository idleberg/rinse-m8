<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rinse M8</title>
    <script>'use strict';
      try {
        const theme = localStorage.getItem('theme');

        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }

        // The theme, from the built-in list in theme.svelte.ts. Nothing stored, or an unknown one, falls back to the
        // default, Graphix. A custom theme sets the built-in theme it extends, if any.
        const skins = ['asciitron', 'graphix', 'm8pl8'];
        const skin = localStorage.getItem('skin');

        if (skin?.startsWith('custom:')) {
          const extended = localStorage.getItem('skin-extends');

          if (skins.includes(extended)) {
            document.documentElement.dataset.skin = extended;
          }
        } else {
          document.documentElement.dataset.skin = skins.includes(skin) ? skin : 'graphix';
        }
      } catch {
        // No storage: follow the system appearance
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
    <script>'use strict';
      // The picked custom theme's link, which theme.svelte.ts reuses by its id. In the body, it comes after every
      // style in the head.
      try {
        const href = localStorage.getItem('skin-href');

        if (href) {
          const link = document.createElement('link');

          link.id = 'custom-theme';
          link.rel = 'stylesheet';
          link.href = href;
          document.body.append(link);
        }
      } catch {
        // No storage: no custom theme
      }
    </script>
  </body>
</html>
